[workspace]
members = [
  "crates/core",
  "crates/daemon",
  "crates/emission",
  "crates/translator",
  "crates/wire",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
signal-pattern-nexus = { git = "https://github.com/LiGoldragon/signal-pattern-nexus", rev = "19efd56669ff710770883967bf76e1eba7fdd113", default-features = false }
meta-signal-pattern-nexus = { git = "https://github.com/LiGoldragon/meta-signal-pattern-nexus", rev = "cf2825f84d005ec40bce1b16307491a837e66ee0", default-features = false }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "4f5cbb9", default-features = false }
nexus-exchange = { git = "https://github.com/LiGoldragon/nexus", rev = "a4bc0113c10c34ec9d92cde2d650eca9324144db", default-features = false }
nexus-querying = { git = "https://github.com/LiGoldragon/nexus", rev = "a4bc0113c10c34ec9d92cde2d650eca9324144db", default-features = false }
nexus-serving = { git = "https://github.com/LiGoldragon/nexus", rev = "a4bc0113c10c34ec9d92cde2d650eca9324144db", default-features = false }
kameo = "0.22"
tokio = { version = "1.53", default-features = false }
futures-util = { version = "0.3", default-features = false }
shared-translator = { package = "translator", git = "https://github.com/LiGoldragon/translator", rev = "29601a3", default-features = false, features = ["unix"] }
translator = { git = "https://github.com/LiGoldragon/translator", rev = "29601a3", default-features = false, features = ["unix"] }
translator-client = { git = "https://github.com/LiGoldragon/translator", rev = "2739d586e1455a001661fc85a8a61b6219aa99df", default-features = false }
translator-serving = { git = "https://github.com/LiGoldragon/translator", rev = "2739d586e1455a001661fc85a8a61b6219aa99df", default-features = false }
