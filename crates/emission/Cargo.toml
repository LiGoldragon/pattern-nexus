[package]
name = "emission-pattern-nexus"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal-pattern-nexus/datom", "meta-signal-pattern-nexus/datom", "nexus-exchange/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal.workspace = true
signal-pattern-nexus.workspace = true
meta-signal-pattern-nexus.workspace = true
nexus-exchange.workspace = true
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
