[package]
name = "pattern-nexus-daemon"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
pattern-nexus-core = { path = "../core" }
pattern-nexus-wire = { path = "../wire" }
emission-pattern-nexus = { path = "../emission" }
meta-signal-pattern-nexus.workspace = true
signal-pattern-nexus.workspace = true
signal.workspace = true
nexus-exchange.workspace = true
nexus-serving.workspace = true
translator.workspace = true
kameo.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
futures-util = { workspace = true }
nix = { version = "0.30", features = ["fs", "socket", "user"] }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[dev-dependencies]
nexus-querying.workspace = true
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# wire::Output is the contract's own reply, returned whole.
result_large_err = "allow"
